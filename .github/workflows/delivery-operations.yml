# Consumer signal adapter; the immutable common receiver authenticates state.
# yamllint disable rule:truthy
---
name: Protected delivery operations
on:
  pull_request_target:
    types: [edited, labeled, unlabeled, ready_for_review, converted_to_draft]
  workflow_run:
    workflows: [Repository review events]
    types: [completed]
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  refresh:
    permissions:
      contents: read
      actions: write
      pull-requests: read
    uses: ltn-it/.github/.github/workflows/delivery-operations.yml@3818c2606c0043f678da6edf7e83d19e25fda2dc
